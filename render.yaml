services:
  # Backend Service
  - type: web
    name: journalism-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/workshops

